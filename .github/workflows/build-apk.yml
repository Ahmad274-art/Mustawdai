name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unzip uploaded project zip (if any)
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -o "$z" -d . ; done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp -f index.html www/index.html

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Icons
        run: |
          pip install pillow
          python3 make_icons.py

      - name: Fixed signing key (keeps data when updating the app)
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file('../../mustawdai.keystore')
                      storePassword 'android'
                      keyAlias 'mustawdai'
                      keyPassword 'android'
                      storeType 'pkcs12'
                  }
              }
          }
          GRADLE

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mustawdai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mustawdai-APK
          path: Mustawdai.apk

      - name: Publish release (direct download link)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Mustawdai.apk --title "Mustawdai APK" --notes "Latest build of the app. Download Mustawdai.apk and install it."
