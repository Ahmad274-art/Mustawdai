name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unzip uploaded project zip (if any)
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -o "$z" -d . ; done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp -f index.html www/index.html

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Icons
        run: |
          pip install pillow
          python3 make_icons.py

      - name: App version
        run: |
          VER=$(grep -oP 'const VER="\K[^"]+' index.html | head -1)
          echo "App version: $VER (build ${{ github.run_number }})"
          sed -i -E "s/^([[:space:]]*)versionCode[[:space:]]+[0-9]+/\1versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/^([[:space:]]*)versionName[[:space:]]+\"[^\"]*\"/\1versionName \"$VER\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Signing key from GitHub secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Missing secrets. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS in Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv("KS_FILE"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASS")
                      storeType 'pkcs12'
                  }
              }
          }
          GRADLE

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          KS_FILE: ${{ runner.temp }}/release.p12
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mustawdai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mustawdai-APK
          path: Mustawdai.apk

      - name: Publish release (direct download link)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Mustawdai.apk --title "Mustawdai APK" --notes "Latest build of the app. Download Mustawdai.apk and install it."
